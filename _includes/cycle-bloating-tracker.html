var PC={'Menstrual':'#D4537E','Follicular':'#639922','Ovulation':'#378ADD','Luteal':'#BA7517'};
var PB={'Menstrual':'#FBEAF0','Follicular':'#EAF3DE','Ovulation':'#E6F1FB','Luteal':'#FAEEDA'};

var BC=['#639922','#639922','#BA7517','#BA7517','#D85A30','#D85A30','#E24B4A','#E24B4A'];
var BL=['Very low','Low','Mild','Mild-medium','Medium','Medium-high','High','Very high'];
function bi(v){if(v<=10)return 0;if(v<=20)return 1;if(v<=30)return 2;if(v<=40)return 3;if(v<=55)return 4;if(v<=65)return 5;if(v<=75)return 6;return 7;}
function hl(v){if(v<=15)return'very low';if(v<=35)return'low';if(v<=55)return'moderate';if(v<=75)return'elevated';if(v<=90)return'high';return'peak';}
function draw(day){
var cv=document.getElementById('ctc'),ctx=cv.getContext('2d');
var cx=110,cy=110,or=104,ir=66,sa=(2*Math.PI)/28,st=-Math.PI/2;
ctx.clearRect(0,0,220,220);
for(var i=0;i<28;i++){
var a=st+i*sa,ea=a+sa-0.015,act=i===day-1;
ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,act?or+5:or,a,ea);ctx.closePath();
ctx.fillStyle=PC[D[i].ph]+(act?'ff':'55');ctx.fill();
if(act){ctx.strokeStyle=PC[D[i].ph];ctx.lineWidth=2;ctx.stroke();}
}
ctx.beginPath();ctx.arc(cx,cy,ir,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();
}
function buildStrip(){
var s=document.getElementById('strip');s.innerHTML='';
for(var i=0;i<28;i++){
var p=document.createElement('div');p.className='ct-pip';p.style.background=PC[D[i].ph];p.dataset.d=i+1;
p.title='Day '+(i+1)+' \u2014 '+D[i].ph;
p.onclick=(function(d){return function(){go(d);};})(i+1);
s.appendChild(p);
}
}
function go(day){
var d=D[day-1];
document.getElementById('sl').value=day;document.getElementById('sv').textContent=day;document.getElementById('dn').textContent=day;
draw(day);
document.querySelectorAll('.ct-pip').forEach(function(p){p.classList.toggle('active',parseInt(p.dataset.d)===day);});
var b=document.getElementById('badge');b.style.background=PB[d.ph];b.style.color=PT[d.ph];b.textContent=d.ph+' phase \u2014 day '+day;
var idx=bi(d.b);
document.getElementById('bf').style.width=d.b+'%';document.getElementById('bf').style.background=BC[idx];
document.getElementById('bv').textContent=BL[idx];document.getElementById('bv').style.color=BC[idx];
document.getElementById('drv').textContent=d.dr;
document.getElementById('ef').style.width=d.e+'%';document.getElementById('pf').style.width=d.p+'%';
document.getElementById('el').textContent=hl(d.e);document.getElementById('pl').textContent=hl(d.p);
var sw=document.getElementById('symp');sw.innerHTML='';
d.s.forEach(function(t){
var r=document.createElement('div');r.className='ct-srow';
var dt=document.createElement('span');dt.className='ct-dot';dt.style.background=PC[d.ph];
r.appendChild(dt);var tx=document.createElement('span');tx.textContent=t;r.appendChild(tx);sw.appendChild(r);
});
document.getElementById('rem').textContent='\u201c'+d.r+'\u201d';
setTimeout(function(){
var h=document.body.scrollHeight;
window.parent.postMessage({ctHeight:h},'*');
},50);
}
buildStrip();draw(1);go(1);
document.getElementById('sl').addEventListener('input',function(){go(parseInt(this.value));});
